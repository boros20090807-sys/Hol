<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>изменить пароль</title>
</head>

<body>
    {% include "message.html" %}
    <div class="section">
        <form method="POST">
            {% csrf_token %}
            <input type="password" name="old_password" placeholder="старый пороль">
            <input type="password" name="new_password" placeholder="новый пороль">
            <input type="password" name="new_password2" placeholder="повтарите новый пороль">
            <button type="submit">изменить</button>
        </form>
    </div>
</body>

</html>
